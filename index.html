
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL SERVICES | Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f9fb;color:#183044}
button,input{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:white;padding:30px;border-radius:18px;width:100%;max-width:400px;box-shadow:0 8px 35px #1233}
h1{font-size:25px}
.brand{color:#08a9c5;font-weight:bold;letter-spacing:2px}
input{width:100%;padding:13px;margin:8px 0 17px;border:1px solid #d8e4e9;border-radius:9px}
label{font-size:14px;font-weight:bold}
button{border:0;padding:13px 18px;border-radius:9px;background:#08b6d0;color:white;font-weight:bold;cursor:pointer}
.login button{width:100%}
.error{color:#c33;font-size:13px}
#dashboard{display:none}
.sidebar{position:fixed;width:220px;height:100vh;background:white;padding:22px;border-right:1px solid #ddd}
.sidebar button{display:block;width:100%;margin-top:12px;text-align:left;background:#e9f9fc;color:#087f99}
main{margin-left:220px;padding:25px}
.top{background:white;padding:18px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:25px}
.card{background:white;padding:22px;border-radius:13px}
.card span{color:#718596}
.card h2{font-size:30px;color:#08a9c5}
.panel{background:white;padding:22px;margin-top:20px;border-radius:13px}
.page{display:none}
.page.active{display:block}
@media(max-width:700px){
.sidebar{position:static;width:100%;height:auto}
.sidebar button{display:inline-block;width:auto;margin:5px}
main{margin:0;padding:13px}
.stats{grid-template-columns:repeat(2,1fr)}
.top{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="login" id="login">
<form class="login-card" id="loginForm">
<div class="brand">✦ ALL SERVICES</div>
<h1>Admin Login</h1>
<p>Sign in to your administrator account.</p>
<label>Email Address</label>
<input id="email" type="email" required placeholder="Admin email">
<label>Password</label>
<input id="password" type="password" required placeholder="Password">
<button id="loginBtn">Sign In</button>
<p class="error" id="error"></p>
</form>
</div>

<div id="dashboard">
<aside class="sidebar">
<div class="brand">ALL SERVICES</div>
<button onclick="showPage('home')">Dashboard</button>
<button onclick="showPage('profiles')">Profiles</button>
<button onclick="showPage('bookings')">Bookings</button>
<button onclick="showPage('services')">Services</button>
<button onclick="showPage('inquiries')">Inquiries</button>
<button onclick="logout()">Sign Out</button>
</aside>

<main>
<header class="top">
<div>
<strong>Admin Dashboard</strong>
<p id="adminEmail"></p>
</div>
<button onclick="logout()">Logout</button>
</header>

<section id="home" class="page active">
<h1>Dashboard Overview</h1>
<div class="stats">
<div class="card"><span>Profiles</span><h2 id="profilesCount">—</h2></div>
<div class="card"><span>Bookings</span><h2 id="bookingsCount">—</h2></div>
<div class="card"><span>Services</span><h2 id="servicesCount">—</h2></div>
<div class="card"><span>Inquiries</span><h2 id="inquiriesCount">—</h2></div>
</div>
<div class="panel" id="status">Connecting to database...</div>
</section>

<section id="profiles" class="page"><h1>Profiles</h1><div class="panel" id="profilesData">Loading...</div></section>
<section id="bookings" class="page"><h1>Bookings</h1><div class="panel" id="bookingsData">Loading...</div></section>
<section id="services" class="page"><h1>Services</h1><div class="panel" id="servicesData">Loading...</div></section>
<section id="inquiries" class="page"><h1>Inquiries</h1><div class="panel" id="inquiriesData">Loading...</div></section>
</main>
</div>

<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL='https://hjkktuoroqkuagdlxvfw.supabase.co';
const SUPABASE_KEY='PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE';

const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);

const $=id=>document.getElementById(id);

async function checkSession(){
const {data:{session}}=await supabase.auth.getSession();
if(session) await verifyAdmin(session);
}

async function verifyAdmin(session){
if(session.user.app_metadata?.role!=='admin'){
await supabase.auth.signOut();
$('error').textContent='Admin access required.';
$('login').style.display='grid';
$('dashboard').style.display='none';
return;
}
$('login').style.display='none';
$('dashboard').style.display='block';
$('adminEmail').textContent=session.user.email;
loadCounts();
}

$('loginForm').addEventListener('submit',async e=>{
e.preventDefault();
$('loginBtn').disabled=true;
$('error').textContent='';
const {data,error}=await supabase.auth.signInWithPassword({
email:$('email').value.trim(),
password:$('password').value
});
$('loginBtn').disabled=false;
if(error){
$('error').textContent=error.message;
return;
}
await verifyAdmin(data);
});

async function loadCounts(){
const tables=['profiles','bookings','services','inquiries'];
let failed=[];
for(const table of tables){
const {count,error}=await supabase.from(table).select('*',{count:'exact',head:true});
$(table+'Count').textContent=error?'—':count;
$(table+'Data').textContent=error?error.message:count+' records found.';
if(error) failed.push(table);
}
$('status').textContent=failed.length?
'Some tables could not be read: '+failed.join(', '):
'Database connected successfully.';
}

window.showPage=id=>{
document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
$(id).classList.add('active');
};

window.logout=async()=>{
await supabase.auth.signOut();
$('dashboard').style.display='none';
$('login').style.display='grid';
$('password').value='';
};

supabase.auth.onAuthStateChange((event,session)=>{
if(event==='SIGNED_OUT'){
$('dashboard').style.display='none';
$('login').style.display='grid';
}
});

checkSession();
</script>
</body>
</html>
